<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCAD Champions: O Duelo de Titãs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 border-b border-slate-700 py-4 px-8 shadow-md flex justify-between items-center">
        <h1 class="text-2xl font-bold text-red-500 flex items-center gap-2">
            ⚙️ AutoCAD Champions: <span class="text-white text-lg font-normal">Duelo de Titãs</span>
        </h1>
        <div id="painel-badge" class="text-sm bg-blue-600 px-4 py-1.5 rounded-full text-white font-semibold">
            Modo Aluno
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow flex flex-col items-center justify-center">

        <!-- TELA DO ALUNO: LOGIN -->
        <section id="view-aluno-login" class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700 text-center">
            <h2 class="text-2xl font-bold mb-2 text-red-400">Entre na Arena</h2>
            <p class="text-slate-400 mb-6 text-sm">Digite seu nome para se conectar à partida do professor.</p>
            <input type="text" id="aluno-nome-input" placeholder="Seu Nome ou Apelido" 
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white mb-4 focus:outline-none focus:border-red-500 text-center">
            <button onclick="alunoEntrar()" class="w-full bg-red-600 hover:bg-red-700 font-bold py-3.5 rounded-xl transition shadow-lg cursor-pointer">
                Entrar na Sala de Espera 🚀
            </button>
        </section>

        <!-- TELA DO ALUNO: ESPERA -->
        <section id="view-aluno-espera" class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700 text-center hidden">
            <div class="animate-pulse text-red-400 text-5xl mb-4">⏳</div>
            <h2 class="text-2xl font-bold mb-2 text-white">Você está na Sala!</h2>
            <p class="text-slate-400 text-sm mb-6">Prepare-se! Cada duelo terá uma série de 10 perguntas técnicas.</p>
            <div id="aluno-status-msg" class="bg-slate-900 p
